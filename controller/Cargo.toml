[package]
name = "smashcraft-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false
license = "MIT"
description = "Smashcraft's plug-in for wc3-controller: the map's session and journal helper (wc3-journal)"

[dependencies]
wc3-controller = { git = "https://github.com/tompassarelli/wc3-controller", tag = "v0.3.1" }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { git = "https://github.com/tompassarelli/enigo", rev = "0b7bae348b0ba7108b81bc4c7267e5bb2d6a509b" }
ctrlc = { version = "3.5", features = ["termination"] }
evdev = "=0.13.2"
libc = "0.2"
serde_json = "1.0"

[[bin]]
name = "wc3-journal"
path = "src/main.rs"
