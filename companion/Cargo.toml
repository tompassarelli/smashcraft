[package]
name = "wc3-controller"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
publish = false

[dependencies]
sdl3 = { version = "=0.20.0", features = ["build-from-source-static", "build-from-source-unix-console"] }
enigo = { git = "https://github.com/tompassarelli/enigo", rev = "0b7bae348b0ba7108b81bc4c7267e5bb2d6a509b" }
ctrlc = "3.5"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.13.2"
libc = "0.2"
x11rb = { version = "0.14", features = ["res"] }
serde_json = "1.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[[bin]]
name = "wc3-journal"
path = "src/bin/journal.rs"
