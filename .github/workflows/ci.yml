name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  development-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - run: bun scripts/ci.ts
        working-directory: ts
