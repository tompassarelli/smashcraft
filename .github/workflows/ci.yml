name: CI

on:
  pull_request:
  push:
    # `bun wisp farm`'s scratch branches run only the workflow it dispatches.
    branches-ignore: ["farm/**"]
  # Autoland's pushes to main start no workflows, so it dispatches this one.
  workflow_dispatch:

permissions:
  contents: read

# Lanes land on main every few minutes. One run per ref finishes; a newer push
# replaces only the queued run, so the newest commit is always the next verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # No game files or copied game scripts outside the allowlist (wisp:docs/clean-room.md).
      - run: bun scripts/cleanRoom.ts
        working-directory: ts
      # Hosted runners for this private repository are smaller than the development
      # machine the timing targets describe; integration gates them on that machine.
      - run: bun scripts/ci.ts
        working-directory: ts
        env:
          CI_TIMING: report
      - name: Report every selectable computer fighter
        if: ${{ !cancelled() }}
        run: bun scripts/cpuCoverage.ts
        working-directory: ts
      # Replay tapes and the numeric corpus in a stock Lua32 and in one whose
      # raw float + - * round toward zero (wisp:docs/headless.md#raw-float-rounding):
      # both must equal Bun, so no raw float operation leaks past the exact helpers.
      - if: ${{ !cancelled() }}
        run: bun wisp parity tapes && bun wisp parity numeric
        working-directory: ts
      # Every native recording in the checked-in corpus replays headless with 0
      # divergent frames, each on the source that recorded it (wisp#69).
      - if: ${{ !cancelled() }}
        run: bun wisp parity corpus test/corpus
        working-directory: ts
      # Frame-cost landing gate (#48, #168): the playable build's four-fighter bot match,
      # each frame's cost predicted from counts (not time), may not rise beyond 5%
      # over the committed baseline. After an intended rise or a cut, rewrite the
      # baseline with `bun wisp perf playable-bot-four --out test/fixtures/perf/playable-bot-four.perf`.
      # Its absolute budget is p99 <= 10 ms and worst <= 14 ms.
      # It runs even when an earlier check fails, so a red logic suite cannot hide a cost rise.
      - if: ${{ !cancelled() }}
        run: bun wisp perf playable-bot-four --samples --out build/playable-bot-four.perf && bun wisp perf compare test/fixtures/perf/playable-bot-four.perf build/playable-bot-four.perf && bun wisp perf budget build/playable-bot-four.perf
        working-directory: ts

  lua-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Leave two of the workflow's eight runner slots for Bun and development.
      max-parallel: 6
      matrix:
        include:
          - partition: bot
            game-tests: game/match/bot
            game-tests-exclude: ""
            sweeps: ""
          - partition: remainder
            game-tests: ""
            game-tests-exclude: game/match/bot
            sweeps: ""
          # Each sweep runs in exactly one of these six name-hash partitions.
          - partition: sweeps 1/6
            game-tests: ""
            game-tests-exclude: ""
            sweeps: "1"
            lua-partition: 0/6
          - partition: sweeps 2/6
            game-tests: ""
            game-tests-exclude: ""
            sweeps: "1"
            lua-partition: 1/6
          - partition: sweeps 3/6
            game-tests: ""
            game-tests-exclude: ""
            sweeps: "1"
            lua-partition: 2/6
          - partition: sweeps 4/6
            game-tests: ""
            game-tests-exclude: ""
            sweeps: "1"
            lua-partition: 3/6
          - partition: sweeps 5/6
            game-tests: ""
            game-tests-exclude: ""
            sweeps: "1"
            lua-partition: 4/6
          - partition: sweeps 6/6
            game-tests: ""
            game-tests-exclude: ""
            sweeps: "1"
            lua-partition: 5/6
    name: Lua32 (${{ matrix.partition }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # These disjoint partitions run every original module; auxiliary memory
      # and stack checks run once with the remainder. Each runs four Lua
      # processes at once, one a runner core.
      - run: bun scripts/lua-tests.ts
        working-directory: ts
        env:
          GAME_TESTS: ${{ matrix.game-tests }}
          GAME_TESTS_EXCLUDE: ${{ matrix.game-tests-exclude }}
          SWEEPS: ${{ matrix.sweeps }}
          LUA_JOBS: ${{ matrix.sweeps == '1' && '4' || '1' }}
          LUA_PARTITION: ${{ matrix.lua-partition || '0/1' }}

  # Sweeps (many matches, whole-roster measurements) that the suite skips run
  # here on every push, so a failure still turns main red (#243).
  sweeps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: Sweeps (Bun)
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - run: bun run test
        working-directory: ts
        env:
          SWEEPS: "1"

  # Autoland dispatches this workflow after a landing, and a dispatched run
  # starts no workflow_run, so it hands its own result to "Main is red".
  main-red:
    needs: [development-loop, lua-tests, sweeps]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run main-red.yml -R "${{ github.repository }}" -f run="${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
