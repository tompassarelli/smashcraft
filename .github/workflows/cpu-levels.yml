name: Computer difficulty

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to measure
        default: main

run-name: Computer difficulty ${{ inputs.ref }}

permissions:
  contents: read

jobs:
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Compare all difficulty levels
        working-directory: ts
        run: |
          mkdir -p build/cpu-levels
          bun scripts/cpuLevels.ts --matches 20 --top 100 --stocks 3 --minutes 4 > build/cpu-levels/report.md
          cat build/cpu-levels/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-levels
          path: ts/build/cpu-levels/report.md
          retention-days: 30
