name: Computer difficulty

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to measure
        default: main
      lane:
        description: The claude/ lane that holds the commit; empty for main
        default: ""

run-name: Computer difficulty ${{ inputs.ref }}

concurrency:
  group: cpu-tiers ${{ inputs.lane || inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  tiers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts
          bun scripts/farmGuard.ts --workflow tiers --sha "$(git rev-parse HEAD)" --lane "$LANE"
      - name: Compare all difficulty tiers
        working-directory: ts
        run: |
          mkdir -p build/cpu-tiers
          bun scripts/cpuTiers.ts --matches 20 --top 100 --stocks 3 --minutes 4 > build/cpu-tiers/report.md
          cat build/cpu-tiers/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-tiers
          path: ts/build/cpu-tiers/report.md
          retention-days: 30
