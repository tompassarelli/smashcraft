name: Main is red

# Each finished CI run on main first goes to the sheriff, which reverts a
# landing that turned a green main red (smashcraft:ts/scripts/sheriff.ts); the
# rest open, update or close the one "main is red" issue
# (smashcraft:ts/scripts/mainRed.ts). Dispatch with a run ID to report
# any branch's run, as "BRANCH is red".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: CI run ID to report
        required: true

permissions:
  actions: write
  contents: write
  issues: write

# One queue per branch: GitHub keeps one pending run per group and cancels the
# older, so a dispatched report would otherwise be lost to main's next event.
concurrency:
  group: main-red-${{ github.event.workflow_run.head_branch || inputs.run }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # CI dispatches its own report while its last job is still running.
      - if: inputs.run != ''
        run: gh run watch "${{ inputs.run }}" -i 60 > /dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - id: sheriff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          bun scripts/sheriff.ts "${{ inputs.run || github.event.workflow_run.id }}"
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # A reverted landing gets no issue: the revert's own CI run reports.
      - if: ${{ !cancelled() && steps.sheriff.outputs.reverted == '' }}
        run: bun scripts/mainRed.ts "${{ inputs.run || github.event.workflow_run.id }}"
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
