name: Memory soak

# #168's memory soak: the playable build plays match after match, every
# fighter and stage, for MINUTES game minutes in 32-bit Lua, and
# `bun wisp soak memory` fails when the Lua heap, live Warcraft handles or
# what the map's globals reach grow after warm-up. `bun wisp farm memory`
# dispatches it; it also runs nightly on main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to soak
        default: main
      minutes:
        description: Game minutes to play
        default: "30"
      tag:
        description: Names the run so `bun wisp farm` can find the one it dispatched
        default: ""
  schedule:
    - cron: "17 4 * * *"

run-name: Memory soak ${{ inputs.ref || 'main' }} ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Soak ${{ inputs.minutes || '30' }} game minutes
        working-directory: ts
        run: |
          set -o pipefail
          mkdir -p memory-out
          bun wisp soak memory --minutes "${{ inputs.minutes || '30' }}" --out memory-out/samples.txt 2>&1 | tee memory-out/verdict.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak
          path: ts/memory-out
          retention-days: 14
