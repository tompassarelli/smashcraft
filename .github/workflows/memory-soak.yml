name: Memory soak

# #168's memory soak: the playable build plays match after match, every
# fighter and stage, for MINUTES game minutes in 32-bit Lua, and
# `bun wisp soak memory` fails when the Lua heap, live Warcraft handles or
# what the map's globals reach grow after warm-up. `bun wisp farm memory`
# dispatches it; it also runs nightly on main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to soak, on main or on the lane
        default: main
      lane:
        description: The claude/ lane whose tip this soaks; empty for main
        default: ""
      minutes:
        description: Game minutes to play
        default: "30"
      matches:
        description: All-computer release matches instead of the memory slope check
        default: ""
      tag:
        description: Names the run so `bun wisp farm` can find the one it dispatched
        default: ""
  schedule:
    - cron: "17 4 * * *"

run-name: Memory soak ${{ inputs.ref || 'main' }} ${{ inputs.tag }}

concurrency:
  group: memory-soak ${{ inputs.lane || 'main' }} ${{ inputs.minutes || '30' }} ${{ inputs.matches }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  soak:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(inputs.matches == '1' && '[0]' || inputs.matches == '2' && '[0,1]' || inputs.matches == '3' && '[0,1,2]' || inputs.matches && '[0,1,2,3]' || '[0]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts
          bun scripts/farmGuard.ts --workflow memory --sha "$(git rev-parse HEAD)" --lane "$LANE"
      - name: Soak ${{ inputs.minutes || '30' }} game minutes
        working-directory: ts
        env:
          RELEASE_MATCHES: ${{ inputs.matches }}
          RELEASE_SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          mkdir -p memory-out
          args=()
          if [[ -n "$RELEASE_MATCHES" ]]; then
            shards=4
            if (( RELEASE_MATCHES < shards )); then shards=$RELEASE_MATCHES; fi
            base=$(( RELEASE_MATCHES / shards ))
            remainder=$(( RELEASE_MATCHES % shards ))
            count=$base
            extra=$RELEASE_SHARD
            if (( RELEASE_SHARD < remainder )); then count=$(( count + 1 )); else extra=$remainder; fi
            first=$(( RELEASE_SHARD * base + extra ))
            args+=(--matches "$count" --first "$first")
          fi
          bun wisp soak memory --minutes "${{ inputs.minutes || '30' }}" "${args[@]}" --out memory-out/samples.txt 2>&1 | tee memory-out/verdict.txt
          if [[ -n "$RELEASE_MATCHES" && "$RELEASE_SHARD" == 0 ]]; then cp build/playable.lua memory-out/playable.lua; fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak${{ inputs.matches && format('-{0}', matrix.shard) || '' }}
          path: ts/memory-out
          retention-days: 14
