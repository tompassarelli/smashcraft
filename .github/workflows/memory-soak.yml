name: Memory soak

# #168's memory soak: the playable build plays match after match, every
# fighter and stage, for MINUTES game minutes in 32-bit Lua, and
# `bun wisp soak memory` fails when the Lua heap, live Warcraft handles or
# what the map's globals reach grow after warm-up. `bun wisp farm memory`
# dispatches it; it also runs nightly on main.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to soak
        default: main
      minutes:
        description: Game minutes to play
        default: "30"
      tag:
        description: Names the run so `bun wisp farm` can find the one it dispatched
        default: ""
  schedule:
    - cron: "17 4 * * *"

run-name: Memory soak ${{ inputs.ref || 'main' }} ${{ inputs.tag }}

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Build a 32-bit Lua
        working-directory: ts
        run: |
          mkdir -p build/lua-stock
          curl -fsSL https://www.lua.org/ftp/lua-5.3.6.tar.gz -o build/lua-5.3.6.tar.gz
          echo 'fc5fd69bb8736323f026672b1b7235da613d7177e72558893a0bdcd320466d60  build/lua-5.3.6.tar.gz' | sha256sum --check
          tar -xzf build/lua-5.3.6.tar.gz -C build/lua-stock
          make -C build/lua-stock/lua-5.3.6 -j2 generic MYCFLAGS=-DLUA_32BITS
      - name: Soak ${{ inputs.minutes || '30' }} game minutes
        working-directory: ts
        env:
          LUA: ${{ github.workspace }}/ts/build/lua-stock/lua-5.3.6/src/lua
        run: |
          set -o pipefail
          mkdir -p memory-out
          bun wisp soak memory --minutes "${{ inputs.minutes || '30' }}" --out memory-out/samples.txt 2>&1 | tee memory-out/verdict.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-soak
          path: ts/memory-out
          retention-days: 14
