name: Companion

on:
  workflow_dispatch:
  push:
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: read

concurrency:
  group: companion-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@v5
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libudev-dev libxkbcommon-dev
      - name: Pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      # The Linux journal accepts control timestamps only from btrfs, XFS or
      # tmpfs; the runner's /tmp is ext4, /dev/shm is tmpfs.
      - name: Unit tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then export TMPDIR=/dev/shm; fi
          cargo test --locked --workspace
      # End-to-end: a scripted pad drives the real helper binary, which must type
      # every #18 action, in order and nothing else, into a focused stand-in
      # "Warcraft III" window and nothing into a second window; any lost, extra or
      # misordered key fails the job. Linux focus needs Niri or labwc.
      # Simulated layer:
      # - Windows: only the pad is simulated: a ViGEmBus virtual DualShock 4 (a USB
      #   HID device; the Xbox 360 target needs xusb22.sys, absent on Windows
      #   Server). The helper reads it through its normal SDL hardware path.
      # - macOS: virtual HID devices need an Apple-restricted entitlement, so the
      #   helper's --virtual-pad (an SDL virtual gamepad inside the helper)
      #   replaces device acquisition. Mapping, focus gating and key output are real.
      - name: Install ViGEmBus virtual pad driver
        if: runner.os == 'Windows'
        run: |
          choco install vigembus --version 1.22.0 -y --no-progress
          sc.exe query ViGEmBus
      - name: End-to-end helper test
        if: runner.os != 'Linux'
        run: cargo test --locked --features e2e --test e2e -- --nocapture
      - name: Build stand-in
        if: runner.os == 'Linux'
        run: cargo build --locked --features e2e --bins
