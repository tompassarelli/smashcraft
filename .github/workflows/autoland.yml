name: Autoland

# A claude/** branch (a cloud worker's) lands on main by itself: rebased onto
# main, checked, and run through the full suites (farm-test.yml); it lands only
# when the suites pass on that exact rebased commit (#394). Otherwise the
# branch stays and the issue its commits reference gets the conflicting files
# or the failures (smashcraft:docs/ci.md).
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      branch:
        description: claude/ branch to land
        required: true

run-name: Autoland ${{ inputs.branch || format('{0} (push)', github.ref_name) }}

permissions:
  contents: write
  actions: write
  issues: write

# One landing at a time; up to 100 branches wait their turn in order. A push
# only queues the branch, so it never waits here itself.
concurrency:
  group: ${{ github.event_name == 'push' && format('autoland-push-{0}', github.ref) || 'autoland' }}
  cancel-in-progress: false
  queue: max

env:
  BRANCH: ${{ inputs.branch || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # A push runs the branch's copy of this file; the landing runs main's.
  queue:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh workflow run autoland.yml --ref main -f branch="$BRANCH"

  rebase:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.rebase.outputs.verdict }}
      sha: ${{ steps.rebase.outputs.sha }}
      base: ${{ steps.rebase.outputs.base }}
      scratch: ${{ steps.rebase.outputs.scratch }}
      issues: ${{ steps.rebase.outputs.issues }}
      detail: ${{ steps.rebase.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      # verdict: test (rebased and checked), conflict, check, empty (main holds it) or gone.
      # Pushing the rebased commit to a scratch farm/ branch runs the pre-push gate.
      - id: rebase
        run: |
          set +e -uo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          detail() { { echo "detail<<AUTOLAND_EOF"; printf '%s\n' "$1"; echo "AUTOLAND_EOF"; } >> "$GITHUB_OUTPUT"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .githooks
          if ! git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then out verdict gone; exit 0; fi
          base=$(git rev-parse origin/main)
          out base "$base"
          out issues "$(git log --format=%B "origin/main..origin/$BRANCH" | grep -ioE '(refs|fixes|closes) (smashcraft)?#[0-9]+' | grep -oE '[0-9]+$' | sort -un | tr '\n' ' ')"
          if [ -z "$(git rev-list "origin/main..origin/$BRANCH")" ]; then out verdict empty; exit 0; fi
          git checkout -q -B autoland "origin/$BRANCH"
          if ! git rebase -q origin/main > rebase.log 2>&1; then
            files=$(git diff --name-only --diff-filter=U)
            git rebase --abort
            out verdict conflict
            detail "${files:-$(tail -20 rebase.log)}"
            exit 0
          fi
          sha=$(git rev-parse HEAD)
          scratch="farm/autoland-${sha:0:12}"
          out sha "$sha"
          if ! git push origin "HEAD:refs/heads/$scratch" > push.log 2>&1; then
            cat push.log
            out verdict check
            detail "$(grep -v '^remote:' push.log | tail -40)"
            exit 0
          fi
          out scratch "$scratch"
          out verdict test

  suite:
    needs: rebase
    if: needs.rebase.outputs.verdict == 'test'
    uses: ./.github/workflows/farm-test.yml
    with:
      ref: ${{ needs.rebase.outputs.sha }}

  land:
    needs: [rebase, suite]
    if: ${{ !cancelled() && needs.rebase.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERDICT: ${{ needs.rebase.outputs.verdict }}
      SHA: ${{ needs.rebase.outputs.sha }}
      BASE: ${{ needs.rebase.outputs.base }}
      SCRATCH: ${{ needs.rebase.outputs.scratch }}
      ISSUES: ${{ needs.rebase.outputs.issues }}
      DETAIL: ${{ needs.rebase.outputs.detail }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - if: env.VERDICT == 'test'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: farm-test-summary
          path: candidate
      - id: land
        run: |
          set +e -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          short=${SHA:0:10}
          refuse() {
            { echo "Autoland didn't land \`$BRANCH\`${SHA:+ ($short, rebased onto main ${BASE:0:10})}: $1"; echo; printf '%s\n' "$2" | head -60
              echo; echo "Run: $RUN_URL. The branch stays; push a fix to it and it tries again."; } > comment.md
            cat comment.md >> "$GITHUB_STEP_SUMMARY"
            for issue in $ISSUES; do gh issue comment "$issue" --body-file comment.md; done
            [ -n "$ISSUES" ] || echo "::warning::no Refs smashcraft#N in the commits: nothing to comment on"
            exit 1
          }
          case "$VERDICT" in
            gone) echo "$BRANCH no longer exists"; exit 0 ;;
            empty) git push origin --delete "$BRANCH"; echo "main already holds $BRANCH: deleted it" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            conflict) refuse "rebasing onto main conflicts in these files:" "$DETAIL" ;;
            check) refuse "the checks failed:" "$(printf '```\n%s\n```' "$DETAIL")" ;;
          esac
          [ -f candidate/summary.json ] || refuse "the suite run ended without a result." ""
          failed=$(jq -r '.failures[], .problems[]' candidate/summary.json)
          if [ -n "$failed" ]; then
            refuse "$(grep -c . <<< "$failed") failing on the rebased commit; main lands only on a green suite, including tests main already fails:" "$(printf '%s\n' "$failed" | sed 's/^/- /')"
          fi
          # Main moved while the suites ran: the tested commit isn't the one that would land, so test again.
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            gh workflow run autoland.yml --ref main -f branch="$BRANCH"
            echo "main moved during the suites: queued $BRANCH again to test the new rebase" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch -q origin "$SCRATCH"
          git push origin "$SHA:refs/heads/main" 2> push.log || refuse "pushing to main failed:" "$(cat push.log)"
          git push origin --delete "$BRANCH"
          # Pushes made with this token start no workflows: start main's CI (main-red follows it).
          gh workflow run ci.yml --ref main || echo "::warning::couldn't start main's CI"
          echo "Landed $BRANCH on main as $short; deleted the branch." >> "$GITHUB_STEP_SUMMARY"
      - if: always() && env.SCRATCH != ''
        run: git push origin --delete "$SCRATCH" || true
