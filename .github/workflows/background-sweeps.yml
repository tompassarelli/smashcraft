name: Background sweeps

on:
  workflow_dispatch:
    inputs:
      ref:
        default: ""
      rebaseline:
        default: ""

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    name: four tests under load ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - run: sudo apt-get install -y stress >/dev/null
      - working-directory: ts
        run: |
          stress --cpu "$(nproc)" > /dev/null 2>&1 &
          fails=0
          for i in 1 2 3 4; do
            for name in frozenThroneFloes pause-screen lobby-echo online-golden; do
              timeout 20m bun test --timeout 900000 "test/$name.test.ts" > "run.log" 2>&1
              code=$?
              echo "shard ${{ matrix.shard }} run $i $name exit=$code load=$(cut -d' ' -f1 /proc/loadavg) $(grep -E '^ +[0-9]+ (pass|fail)' run.log | tr -s ' ' | tr '\n' ' ')"
              if [ "$code" != 0 ]; then fails=$((fails + 1)); tail -60 run.log; fi
            done
          done
          echo "shard ${{ matrix.shard }} failures=$fails"
          test "$fails" = 0
