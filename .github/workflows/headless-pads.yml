name: Headless pads

on:
  workflow_dispatch:
    inputs:
      ref:
        default: main
      lane:
        default: ""
      dirs:
        default: "."
      tag:
        default: ""

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [35bc52f89d54781fd099a6380cbce797502a0f0f, 1576b52d4e]
        attempt: [1, 2, 3]
    name: net pair four humans ${{ matrix.ref }} ${{ matrix.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - working-directory: ts
        run: |
          (cd node_modules/wisp/relay && cargo build --release -p relay 2>&1 | tail -2)
          export WISP_RELAY_BIN="$PWD/node_modules/wisp/relay/target/release/relay"
          ls -la "$WISP_RELAY_BIN"
          git log --oneline -1
          bun wisp net pair --humans 4 --relay local --script test/native/pads/trailer/online-rollback.pad --frames 600
