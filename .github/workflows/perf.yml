name: Perf

# `bun wisp perf` runs on free hosted runners, one job a run: each matrix
# entry is the argument list of one `bun wisp perf` invocation, such as
# "playable-bot-four --samples" or "census --fighter archer". Predictions are
# made from counts, so a hosted runner predicts what this machine would.
# `bun wisp farm perf` dispatches it and downloads every run's output.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to measure
        default: main
      lane:
        description: The claude/ lane or farm/ scratch branch that holds the commit; empty for main
        default: ""
      runs:
        description: JSON array of `bun wisp perf` argument strings
        default: '["playable-bot-four"]'
      tag:
        description: Names the run so `bun wisp farm` can find the one it dispatched
        default: ""

run-name: Perf ${{ inputs.ref }} ${{ inputs.tag }}

concurrency:
  group: perf ${{ inputs.lane || inputs.ref }} ${{ inputs.runs }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The account runs 20 jobs at once across every repository.
      max-parallel: 4
      matrix:
        run: ${{ fromJSON(inputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: ts
      - name: Stop when the commit has left main and the lane
        working-directory: ts
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
        run: |
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD -- scripts/farmGuard.ts
          bun scripts/farmGuard.ts --workflow perf --sha "$(git rev-parse HEAD)" --lane "$LANE"
      - id: name
        env:
          RUN: ${{ matrix.run }}
        run: echo "name=$(printf '%s' "$RUN" | tr -c 'A-Za-z0-9-' '_')" >> "$GITHUB_OUTPUT"
      - name: perf ${{ matrix.run }}
        working-directory: ts
        env:
          RUN: ${{ matrix.run }}
        run: |
          mkdir -p perf-out
          set -o pipefail
          # RUN is split into words on purpose: it is one invocation's argument list.
          bun wisp perf $RUN --out perf-out/run.txt 2>&1 | tee perf-out/summary.txt
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ steps.name.outputs.name }}
          path: ts/perf-out
          retention-days: 7
