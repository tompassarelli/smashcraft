name: Client

on:
  workflow_dispatch:
  push:
    branches-ignore: ["farm/**"]
    paths:
      - "client/**"
      - "companion/model/**"
      - "ts/src/game/replay/**"
      - "ts/scripts/sourceVersion.ts"
      - ".github/workflows/client.yml"

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  # Main moves fast; finish every main run so each landing gets a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Linux window and tray libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # The Replays page's simulation is built from ts/src, which imports Wisp.
      - name: Simulation dependencies
        working-directory: ts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Pages
        working-directory: client/ui
        run: bun install --frozen-lockfile && bun test && bun test ../scripts && bun run check && bun run build
      - name: Pinned Rust toolchain
        working-directory: client/src-tauri
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Tests
        working-directory: client/src-tauri
        run: cargo test --locked
      - name: Release build
        working-directory: client/src-tauri
        run: cargo build --locked --release
      # Unsigned executables for testers; the page files are embedded.
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: smashcraft-${{ runner.os }}
          path: |
            client/src-tauri/target/release/smashcraft.exe
            client/src-tauri/target/release/smashcraft
          if-no-files-found: error
