name: Farm test

# Everything main's CI checks, for one commit on free hosted runners: the Bun
# and 32-bit Lua suites with their sweeps, sharded by each test file's (Bun) or
# test's (Lua) measured time (wisp:docs/farm.md), and CI's other checks.
# `bun wisp farm test` dispatches it and prints the summary the merge job uploads.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to test
        default: main
      tag:
        description: Names the run so `bun wisp farm test` can find the one it dispatched
        default: ""
  # Autoland (autoland.yml) runs the suites for a rebased branch inside its own run.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        default: ""

run-name: Farm test ${{ inputs.ref }} ${{ inputs.tag }}

permissions:
  contents: read

env:
  # A run holds BUN_SHARDS + the lua job's max-parallel + the four check jobs at
  # once: 3 + 5 + 4 = 12, so Autoland's two test slots and a train (36) fit the
  # account's 40 concurrent jobs. One Lua test takes about 140 s, so more than
  # 32 Lua shards would not shorten the run.
  BUN_SHARDS: 3
  # Lua runs one core a process: each Lua job runs LUA_PER_JOB shards at once.
  LUA_JOBS: 8
  LUA_PER_JOB: 4

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      bun: ${{ steps.plan.outputs.bun }}
      lua: ${{ steps.plan.outputs.lua }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      # Every run saves its measurements under a new key; the newest restores here.
      - uses: actions/cache/restore@v4
        with:
          path: ts/farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      # Check jobs record their time as Lua rows; they run on their own runners, so no shard plans them.
      - id: plan
        working-directory: ts
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -f farm-timings.json ]; then
            jq '.lua |= with_entries(select(.key | (startswith("check: ") or startswith("parity corpus: ") or . == "stack-trace profile TypeScript frames") | not))' farm-timings.json > plan-timings.json
          fi
          bun node_modules/wisp/scripts/wisp/farmShards.ts plan --timings plan-timings.json --bun "$BUN_SHARDS" --lua $((LUA_JOBS * LUA_PER_JOB)) $(bun scripts/test.ts --units) > plan.json
          echo "bun=$(jq -c '[range(.bun | length)]' plan.json)" >> "$GITHUB_OUTPUT"
          echo "lua=$(jq -c "[range($LUA_JOBS)]" -n)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: farm-test-plan
          path: ts/plan.json
          retention-days: 3

  bun:
    needs: plan
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.FARM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.bun) }}
    name: bun ${{ matrix.shard }}
    steps:
      - name: Install stock texture converter
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/scripts/wisp/lua32.ts', 'ts/node_modules/wisp/native/toward-zero.h') }}
      - uses: actions/download-artifact@v4
        with:
          name: farm-test-plan
          path: ts
      # The shard's files, then their sweeps (SWEEPS=1): a file's measured time counts both.
      - name: Test shard ${{ matrix.shard }}
        working-directory: ts
        timeout-minutes: 20
        run: |
          set +e
          files=$(jq -r ".bun[${{ matrix.shard }}][]" plan.json)
          mkdir -p build/junit build/junit-sweeps
          TEST_JUNIT_DIR=build/junit bun scripts/test.ts $files
          code=$?
          bun node_modules/wisp/scripts/wisp/farmShards.ts junit --shard ${{ matrix.shard }} --exit-code "$code" build/junit/*.xml > result.json
          SWEEPS=1 TEST_JUNIT_DIR=build/junit-sweeps bun scripts/test.ts $files
          sweeps=$?
          bun node_modules/wisp/scripts/wisp/farmShards.ts junit --shard ${{ matrix.shard }} --exit-code "$sweeps" build/junit-sweeps/*.xml > result-sweeps.json
          [ "$code" = 0 ] && exit "$sweeps"
          exit "$code"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-result-bun-${{ matrix.shard }}
          path: ts/result*.json
          retention-days: 3

  lua:
    needs: plan
    runs-on: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.FARM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.lua) }}
    name: lua32 ${{ matrix.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/scripts/wisp/lua32.ts', 'ts/node_modules/wisp/native/toward-zero.h') }}
      - uses: actions/download-artifact@v4
        with:
          name: farm-test-plan
          path: ts
      - name: Compile the Lua test bundle
        working-directory: ts
        run: |
          set +e -o pipefail
          bun scripts/lua-tests.ts 2>&1 | tee build-compile.log
          code=$?
          if [ "$code" != 0 ] && [ "${{ matrix.job }}" = 0 ]; then
            { echo "Lua test bundle didn't compile:"; grep -E 'error' build-compile.log | head -5; } | tr '\n' ' ' > problems-lua-compile.txt
          fi
          exit "$code"
        env:
          LUA_TESTS_STEP: compile
      # Each slot runs its shard of the suite, then its shard of the sweeps (SWEEPS=1);
      # the plan balances both. Sweep costs stay out of lua-cost-*.tsv: the budget covers the suite.
      - name: Test shards
        working-directory: ts
        timeout-minutes: 20
        run: |
          LUA=$(bun node_modules/wisp/scripts/wisp/lua32.ts stock)
          set +e
          bun node_modules/wisp/scripts/wisp/farmShards.ts lua-plan plan.json > build/lua-plan.tsv
          count=$((LUA_JOBS * LUA_PER_JOB))
          # A failing test's result names the module that registers it.
          result() {
            bun node_modules/wisp/scripts/wisp/farmShards.ts lua --shard "$1" --exit-code "$2" "$3" \
              | jq --rawfile costs "$4" '($costs | split("\n") | map(split("\t") | select(length > 3) | {key: (.[3:] | join("\t")), value: .[0]}) | from_entries) as $modules
                  | .tests |= map(if .status == "fail" then .name = "\($modules[.unit] // "unknown module"): \(.name)" else . end)'
          }
          pids=()
          for slot in $(seq 0 $((LUA_PER_JOB - 1))); do
            shard=$((${{ matrix.job }} * LUA_PER_JOB + slot))
            ( export LUA_SHARD="$shard/$count" LUA_SHARD_PLAN=build/lua-plan.tsv
              touch "build/lua-cost-$shard.tsv" "build/sweep-cost-$shard.tsv"
              LUA_TEST_RESULT="build/lua-$shard.tsv" LUA_TEST_COST="build/lua-cost-$shard.tsv" "$LUA" build/lua-tests/tests.lua > "build/lua-$shard.log" 2>&1
              code=$?
              result "$shard" "$code" "build/lua-$shard.tsv" "build/lua-cost-$shard.tsv" > "result-lua-$shard.json"
              SWEEPS=1 LUA_TEST_RESULT="build/lua-sweeps-$shard.tsv" LUA_TEST_COST="build/sweep-cost-$shard.tsv" "$LUA" build/lua-tests/tests.lua > "build/lua-sweeps-$shard.log" 2>&1
              sweeps=$?
              result "$shard" "$sweeps" "build/lua-sweeps-$shard.tsv" "build/sweep-cost-$shard.tsv" > "result-lua-sweeps-$shard.json"
              [ "$code" = 0 ] && exit "$sweeps"
              exit "$code" ) &
            pids+=($!)
          done
          failed=0
          for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
          for log in build/lua-*.log; do echo "== $log"; cat "$log"; done
          exit "$failed"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-result-lua-${{ matrix.job }}
          path: |
            ts/result-lua-*.json
            ts/problems-*.txt
            ts/build/lua-cost-*.tsv
          retention-days: 3

  # The rest of main's CI, each check a result row of its own; a failing check
  # adds its last output lines to the summary.
  checks:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [perf, parity, corpus, policy]
    name: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wisp/lua32
          key: wisp-lua32-${{ runner.environment }}-${{ hashFiles('ts/node_modules/wisp/scripts/wisp/lua32.ts', 'ts/node_modules/wisp/native/toward-zero.h') }}
      - name: Run the ${{ matrix.group }} checks
        working-directory: ts
        timeout-minutes: 20
        env:
          GROUP: ${{ matrix.group }}
          CI_TIMING: report
        run: |
          set +e
          mkdir -p build
          failed=0
          check() {
            local name="$1" started code
            shift
            started=$(date +%s)
            echo "::group::$name"
            "$@" > build/check.log 2>&1
            code=$?
            cat build/check.log
            echo "::endgroup::"
            printf '%s\t%s\tcheck: %s\n' "$([ "$code" = 0 ] && echo pass || echo fail)" "$(( $(date +%s) - started ))" "$name" >> build/checks.tsv
            if [ "$code" != 0 ]; then
              failed=1
              echo "check: $name exited $code: $(sed 's/\x1b\[[0-9;]*m//g' build/check.log | grep -v '^\s*$' | tail -n 6 | tr '\n' ' ' | cut -c1-700)" >> "problems-check-$GROUP.txt"
            fi
          }
          case "$GROUP" in
            perf)
              # Frame-cost landing gate (#48, #168): see ci.yml for rewriting the baseline.
              check "frame cost within 5% of the committed baseline" sh -c 'bun wisp perf playable-bot-four --samples --out build/playable-bot-four.perf && bun wisp perf compare test/fixtures/perf/playable-bot-four.perf build/playable-bot-four.perf'
              check "focused logic test" env GAME_TESTS=sim/meleeScalarMath bun test test/game.test.ts
              if [ -f build/playable-bot-four.perf ]; then
                bun wisp perf budget build/playable-bot-four.perf || echo "perf target (#168) not met: reported, not gated (#394)"
                bun scripts/commitMetrics.ts build/playable-bot-four.perf build/playable.lua | tee -a "$GITHUB_STEP_SUMMARY"
              fi ;;
            parity)
              # Tapes and the numeric corpus in stock Lua32 and in one whose raw float + - * round toward zero must equal Bun (wisp:docs/headless.md#raw-float-rounding).
              check "parity tapes and numeric" sh -c 'bun wisp parity tapes && bun wisp parity numeric'
              check "stack-trace profile TypeScript frames" env LUA_TESTS_STEP=stack bun scripts/lua-tests.ts ;;
            corpus)
              # Every native recording replays headless with 0 divergent frames, each on the source that recorded it (wisp#69).
              check "parity corpus: every native recording replays headless with 0 divergent frames" bun wisp parity corpus test/corpus
              check "compiler affected-module and output-equivalence checks" env COMPILER_TIMINGS=1 bun scripts/compiler-benchmark.ts ;;
            policy)
              check "no game files or copied game scripts outside the allowlist" bun scripts/cleanRoom.ts
              check "effect-kit check" sh -c 'git clone -q --depth 1 https://github.com/tompassarelli/north "$RUNNER_TEMP/north" && cd .. && bun "$RUNNER_TEMP/north/agent-machinery/scripts/effect-kit.mjs" check'
              check "type-check edit loop and dependency validation" bun scripts/typecheck-benchmark.ts
              check "every selectable computer fighter is active" bun scripts/cpuCoverage.ts ;;
          esac
          bun node_modules/wisp/scripts/wisp/farmShards.ts lua --shard 0 --exit-code "$failed" build/checks.tsv > "result-check-$GROUP.json"
          exit "$failed"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-result-check-${{ matrix.group }}
          path: |
            ts/result-check-*.json
            ts/problems-*.txt
          retention-days: 3

  # The summary is uploaded whatever happens, so a red run always names its cause:
  # failing tests, each failing check's output, Lua budget overruns and missing shards.
  merge:
    needs: [plan, bun, lua, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ hashFiles('ts/bun.lock') }}
      - run: bun install --frozen-lockfile
        working-directory: ts
      - uses: actions/cache/restore@v4
        with:
          path: ts/farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
          restore-keys: farm-test-timings-
      - uses: actions/download-artifact@v4
        with:
          pattern: farm-test-*
          path: ts/farm
      - name: Merge the results and check the Lua32 instruction and allocation budget
        working-directory: ts
        timeout-minutes: 5
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LUA_TEST_COST_DIR: farm
        run: |
          set +e
          fallback() { echo "{\"bun\":$1,\"lua\":$1,\"failures\":[],\"problems\":[$2]}" > summary.json; }
          zero='{"passed":0,"failed":0,"skipped":0,"shards":0,"slowestShardSeconds":0}'
          fallback "$zero" '"the merge step did not finish: see its log"'
          : > problems.txt
          [ "$PLAN_RESULT" = success ] || echo "the plan job ended $PLAN_RESULT, so no shard ran: see its log" >> problems.txt
          bun node_modules/wisp/scripts/wisp/farmShards.ts merge --plan farm/farm-test-plan/plan.json --timings farm-timings.json --out summary.json $(find farm -name 'result*.json') 2> merge.log
          merged=$?
          cat merge.log
          if [ "$merged" != 0 ]; then
            fallback "$zero" ""
            echo "merging the shard results failed: $(tail -n 3 merge.log | tr '\n' ' ')" >> problems.txt
          fi
          LUA_TESTS_STEP=budget bun scripts/lua-tests.ts > budget.log 2>&1
          budget=$?
          cat budget.log
          if [ "$budget" != 0 ]; then
            grep -E '^(src|test|scripts)/[^ ]+\.ts: ' budget.log | sed 's/^/Lua32 budget: /' >> problems.txt
            grep -q '^Lua32 budget: ' problems.txt || echo "the Lua32 budget check exited $budget: $(tail -n 3 budget.log | tr '\n' ' ')" >> problems.txt
          fi
          find farm -name 'problems-*.txt' -exec sh -c 'cat "$1"; echo' _ {} \; >> problems.txt
          jq --rawfile extra problems.txt '.problems = ($extra | split("\n") | map(select(test("\\S")))) + .problems' summary.json > summary.next && mv summary.next summary.json
          cat summary.json
          [ "$merged" = 0 ] && [ "$budget" = 0 ]
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farm-test-summary
          path: ts/summary.json
          retention-days: 7
      - if: always() && hashFiles('ts/farm-timings.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ts/farm-timings.json
          key: farm-test-timings-${{ github.run_id }}
